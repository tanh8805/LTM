# Owner: Nguoi4
# Cấu hình ML dùng chung cho Server và thực nghiệm.

# Cách dùng ML:
#   NONE     : không dùng ML
#   IF       : chỉ Isolation Forest (client)
#   CHRONOS  : chỉ Chronos-Bolt (ml-service)
#   BOTH_OR  : đáng ngờ nếu IF HOẶC Chronos báo bất thường
#   BOTH_AND : đáng ngờ nếu IF VÀ Chronos cùng báo bất thường
# TODO(Nguoi4): Sau khi chạy ExperimentRunner trên trace thật (Recorder), chọn giá trị mặc định tốt nhất
#               (số liệu mô phỏng hiện có: statics/results/README.md; docs/SPEC.md mục 13).
ml.mode = NONE

# ---------------- Chronos (ml-service) ----------------
# Địa chỉ ml-service (FastAPI)
ml.service.url = http://localhost:8000
# Thời gian chờ tối đa mỗi lần gọi (mili giây). Quá hạn thì bỏ qua ML, hệ thống vẫn chạy.
ml.service.timeout.ms = 3000
# Số điểm gần nhất của mỗi máy gửi cho Chronos
ml.chronos.window = 60
# Máy chưa có đủ bấy nhiêu điểm thì chưa gửi cho Chronos
ml.chronos.min.points = 12
# Đáng ngờ khi ngoài khoảng q0.1-q0.9 đủ bấy nhiêu lần liên tiếp
ml.chronos.consecutive = 3
# Kết quả Chronos cũ hơn bấy nhiêu giây thì coi như hết hiệu lực
ml.chronos.valid.seconds = 60

# ---------------- Isolation Forest (client) ----------------
# Số giây đầu client học "bình thường" của chính máy mình (mặc định 5 phút)
ml.client.training.seconds = 300
# threshold = max(điểm lúc học) + margin
ml.if.threshold.margin = 0.05
# Cảnh báo khi vượt threshold đủ bấy nhiêu lần liên tiếp
ml.if.consecutive = 3
