# Owner: Nguoi1
# Cấu hình Server. Chạy Server từ thư mục gốc của repo để đường dẫn tương đối bên dưới đúng.
# Thiếu khóa nào thì Server dùng giá trị mặc định ghi bên dưới.

# ---------------- Mạng ----------------
# Cổng TCP Server lắng nghe
server.port = 5000

# File SQLite (đã nằm trong .gitignore)
db.path = data/exam.db

# Sinh viên im lặng quá số giây này thì Server coi là mất kết nối (nên >= 3 chu kỳ heartbeat = 3 x 10 giây)
heartbeat.timeout.seconds = 30

# Session offline quá số giây này thì token hết hạn (không RECONNECT được nữa)
reconnect.window.seconds = 600

# Độ dài tối đa một dòng JSON (byte). Dòng dài hơn thì ngắt kết nối. Đủ cho file CSV vài nghìn câu hỏi.
message.max.bytes = 2000000

# Số lần LOGIN sai tối đa trên một connection
login.max.failures = 5

# ---------------- Đồng hồ thi ----------------
# Server gửi TIME_SYNC cho sinh viên đang thi mỗi bấy nhiêu giây
time.sync.interval.seconds = 30

# ---------------- Giám sát ----------------
# Chu kỳ MonitorService tính thống kê phòng / gọi ML, và chu kỳ client đo số liệu (giây)
monitor.interval.seconds = 10

# Rule 5: mất focus cửa sổ thi quá số lần này thì cảnh báo
focus.threshold = 3

# ---------------- Thống kê phòng (median + MAD) ----------------
# Chỉ tính khi phòng có ít nhất bấy nhiêu máy online
room.min.machines = 3
# Giá trị của một máy >= X lần trung vị phòng -> cảnh báo VÀNG (reason: "gấp X lần trung vị phòng")
room.warning.multiplier = 3.0
# Giá trị của một máy >= X lần trung vị phòng -> cảnh báo ĐỎ
room.critical.multiplier = 6.0
# Ngoài ra giá trị phải lệch khỏi trung vị hơn bấy nhiêu lần MAD (đã nhân 1.4826), để bỏ qua dao động bình thường
room.mad.threshold = 3.5
# Nếu trung vị nhỏ hơn giá trị này thì dùng giá trị này làm mẫu số (tránh chia cho 0 khi cả phòng đang rảnh)
room.min.median = 1.0

# ---------------- Rate control ----------------
# NORMAL: summary trong HEARTBEAT mỗi 10 giây
rate.normal.interval.ms = 10000
# HIGH: METRICS_DETAIL mỗi 2 giây
rate.high.interval.ms = 2000
# BASELINE: METRICS_DETAIL mỗi 1 giây, không ML
rate.baseline.interval.ms = 1000
# HIGH tự về NORMAL sau bấy nhiêu giây yên
rate.high.quiet.seconds = 60
