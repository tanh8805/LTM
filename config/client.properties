# Cấu hình client (Student và Teacher). Tham số dòng lệnh [host] [port] ghi đè hai khóa đầu.

# Địa chỉ Server
server.host = localhost
server.port = 5000

# Chu kỳ HEARTBEAT trước khi nhận RULES_CONFIG (sau đó Server quy định bằng monitor.interval.seconds)
